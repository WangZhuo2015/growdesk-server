name: Apply bounded migration review edits
on:
  push:
    branches: [codex/migration-readiness-20260922]
    paths:
      - .github/workflows/apply-readiness-20260922.yml
      - .github/review/apply-readiness-20260922.py
      - scripts/legacy-import/canonical_verification.py
      - scripts/legacy-import/release_gate.py
      - scripts/legacy-import/test_readiness_regression.py
      - scripts/legacy-import/test_release_gate.py
permissions:
  contents: write
concurrency:
  group: apply-readiness-20260922
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'WangZhuo2015/growdesk-server' && github.ref == 'refs/heads/codex/migration-readiness-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/migration-readiness-20260922
          fetch-depth: 0
      - name: Apply exact-blob guarded edits
        run: python3 .github/review/apply-readiness-20260922.py
      - name: Check syntax and existing migration gate tests
        run: |
          python3 -m py_compile scripts/legacy-import/canonical_verification.py scripts/legacy-import/release_gate.py scripts/legacy-import/verify_target.py scripts/legacy-import/cutover_runner.py
          python3 scripts/legacy-import/test_verify_target.py
          python3 scripts/legacy-import/test_cutover_runner.py
          python3 scripts/legacy-import/test_release_gate.py
          python3 scripts/legacy-import/test_readiness_regression.py
      - name: Commit only the guarded source edits and remove this temporary publisher
        run: |
          git rm .github/review/apply-readiness-20260922.py .github/workflows/apply-readiness-20260922.yml
          git add scripts/legacy-import/verify_target.py scripts/legacy-import/cutover_runner.py scripts/legacy-import/test_care_materializer_integration.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(migration): enforce runtime reconciliation and separate release readiness'
          git push origin HEAD:refs/heads/codex/migration-readiness-20260922
          git rev-parse HEAD
