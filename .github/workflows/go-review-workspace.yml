name: Go review workspace
on:
  pull_request:
    branches: [codex/web-parity-20260919]
    paths: ['.github/workflows/go-review-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/go-completion-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Export runtime dependencies for isolated local verification
        run: |
          set -eu
          mkdir -p review-runtime
          docker pull postgres:18-bookworm
          docker pull redis:8-bookworm
          docker image inspect postgres:18-bookworm redis:8-bookworm --format '{{json .RepoDigests}}' > review-runtime/images.jsonl
          docker run --rm --network none --entrypoint sh postgres:18-bookworm -c 'tar -C / -czf - usr/lib/postgresql usr/share/postgresql lib/x86_64-linux-gnu usr/lib/x86_64-linux-gnu' > review-runtime/postgres-runtime.tar.gz
          container=$(docker create --network none redis:8-bookworm)
          docker cp "$container:/usr/local/bin/redis-server" review-runtime/redis-server
          docker rm "$container"
          (cd review-runtime && sha256sum postgres-runtime.tar.gz redis-server images.jsonl > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: go-review-runtime-${{ github.event.pull_request.head.sha }}
          path: review-runtime/*
          retention-days: 3
          if-no-files-found: error
