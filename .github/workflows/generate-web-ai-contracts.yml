name: Generate Web AI contract snapshot
on:
  push:
    branches: [codex/complete-integration-20260916]
    paths: [.github/workflows/generate-web-ai-contracts.yml]
permissions:
  contents: write
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run --workspace=@growdesk/contracts build
      - run: npm run backend:contracts:generate
      - run: npm run backend:contracts:check
      - name: Commit only the generated canonical snapshot to this review branch
        run: |
          test "$GITHUB_REF" = refs/heads/codex/complete-integration-20260916
          git diff --check
          git add -- contracts/openapi.json
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = contracts/openapi.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(contracts): regenerate durable Web AI API snapshot'
          git push origin HEAD:refs/heads/codex/complete-integration-20260916
