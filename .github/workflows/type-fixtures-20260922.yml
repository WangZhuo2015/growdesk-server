name: Validate typed migration fixtures
on:
  push:
    branches: [codex/migration-readiness-20260922]
    paths:
      - .github/workflows/type-fixtures-20260922.yml
      - .github/review/type-fixtures-20260922.py
permissions:
  contents: write
concurrency:
  group: typed-migration-fixtures-20260922
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'WangZhuo2015/growdesk-server' && github.ref == 'refs/heads/codex/migration-readiness-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/migration-readiness-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run backend:db:generate
      - name: Apply only exact-blob guarded test edits
        run: python3 .github/review/type-fixtures-20260922.py
      - run: npm run backend:build
      - run: npm run backend:typecheck
      - run: npm run backend:lint
      - run: npm run backend:test:guard
      - run: npm run backend:test:unit
      - name: Publish validated test edits and remove temporary publisher
        run: |
          git rm .github/review/type-fixtures-20260922.py .github/workflows/type-fixtures-20260922.yml
          git add tests/integration/food.test.ts tests/integration/legacy-golden-fixture.ts tests/integration/owned-object-storage.test.ts tests/integration/web-http-parity.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(migration): replace untyped fixture access with runtime-checked values'
          git push origin HEAD:refs/heads/codex/migration-readiness-20260922
          git rev-parse HEAD
