name: Integration development dependencies
on:
  push:
    branches: [codex/ai-integration-complete-20260916]
    paths: [.github/workflows/integration-test-kit.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run backend:db:generate
      - run: npm run backend:build
      - name: Package only locked dependencies and generated client
        run: |
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' -czf "$RUNNER_TEMP/dependencies.tar.gz" node_modules packages/database/src/generated packages/*/dist
          cp "$(command -v node)" "$RUNNER_TEMP/node"
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-dev-dependencies
          path: |
            ${{ runner.temp }}/dependencies.tar.gz
            ${{ runner.temp }}/node
          retention-days: 1
