name: Go backend
on:
  push:
    branches: [codex/go-backend-parity-20260922]
  pull_request:
    branches: [main, codex/web-parity-20260919]
    paths: ['**/*.go', 'go.mod', 'go.sum', 'contracts/**', 'scripts/go-*', '.github/workflows/go-backend.yml']
permissions:
  contents: read
concurrency:
  group: go-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Resolve pinned dependencies
        run: go mod tidy
      - name: Build and race-test the native implementation
        run: |
          go vet ./...
          go test -race -count=1 ./...
          mkdir -p dist-go
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.revision=$(git rev-parse HEAD)" -o dist-go/growdesk-api ./cmd/growdesk-api
          dist-go/growdesk-api --version
          dist-go/growdesk-api --contract-inventory > dist-go/operations.json
      - name: Dependency lock output for reproducible source commits
        if: always()
        run: |
          echo '=== go.mod ==='
          cat go.mod
          echo '=== go.sum ==='
          test ! -f go.sum || cat go.sum
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: native-go-${{ github.sha }}
          path: |
            dist-go/
            go.mod
            go.sum
  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build native executable
        run: |
          go mod tidy
          mkdir -p dist-go
          CGO_ENABLED=0 go build -trimpath -o dist-go/growdesk-api ./cmd/growdesk-api
      - name: Real owned PostgreSQL and Redis HTTP regressions
        run: python3 scripts/go-integration.py --binary dist-go/growdesk-api
