name: Passport review
on:
  pull_request:
    paths:
      - 'internal/backend/passport*'
      - '.github/workflows/passport-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passport-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture the public Redis test binary and its runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p redis-tools/lib
          docker run --rm -v "$PWD/redis-tools:/out" debian:bookworm bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq redis-server
            cp -L /usr/bin/redis-server /out/redis-server
            ldd /usr/bin/redis-server | awk '\''/=> \/.*\(/ { print $3 }'\'' | while read -r library; do
              case "$(basename "$library")" in libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*) continue ;; esac
              cp -L "$library" /out/lib/
            done
          '
          tar -czf passport-redis.tar.gz redis-tools
      - uses: actions/upload-artifact@v4
        with:
          name: passport-redis-${{ github.run_id }}
          path: passport-redis.tar.gz
          retention-days: 1
          if-no-files-found: error
