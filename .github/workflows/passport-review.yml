name: Passport review
on:
  pull_request:
    paths:
      - 'internal/backend/passport*'
      - '.github/workflows/passport-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passport-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Package the public system formatter and its runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p formatter/lib
          tool="$(command -v clang-format)"
          test -x "$tool"
          cp -L "$tool" formatter/clang-format
          ldd "$tool" | awk '/=> \/.*\(/ { print $3 }' | while read -r library; do
            case "$(basename "$library")" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*) continue ;;
            esac
            cp -L "$library" formatter/lib/
          done
          "$tool" --version > formatter/VERSION
          tar -czf passport-formatter.tar.gz formatter
      - uses: actions/upload-artifact@v4
        with:
          name: passport-formatter-${{ github.run_id }}
          path: passport-formatter.tar.gz
          retention-days: 1
          if-no-files-found: error
