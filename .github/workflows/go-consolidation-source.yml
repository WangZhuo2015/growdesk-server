name: Native consolidation source snapshot
on:
  push:
    branches: [codex/go-consolidation-20260924]
    paths: [.github/workflows/go-consolidation-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Retrieve exact public module and committed source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consolidation" "$RUNNER_TEMP/public-go-modules" "$RUNNER_TEMP/empty-module"
          git bundle create "$RUNNER_TEMP/consolidation/server.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/consolidation/server-head.txt"
          cd "$RUNNER_TEMP/empty-module"
          GOMODCACHE="$RUNNER_TEMP/public-go-modules" go mod download -json github.com/SherClockHolmes/webpush-go@v1.4.0 > "$RUNNER_TEMP/consolidation/webpush-module.json"
          tar -czf "$RUNNER_TEMP/consolidation/webpush-module.tar.gz" -C "$RUNNER_TEMP/public-go-modules" .
          cd "$RUNNER_TEMP/consolidation"
          sha256sum ./* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: native-consolidation-${{ github.sha }}
          path: ${{ runner.temp }}/consolidation
          retention-days: 3
          if-no-files-found: error
