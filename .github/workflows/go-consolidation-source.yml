name: Native consolidation source snapshot
on:
  push:
    branches: [codex/go-consolidation-20260924]
    paths: [.github/workflows/go-consolidation-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: server
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: WangZhuo2015/baby_panel_for_cecilia
          ref: c3582203f0577f0b2b31d46f5157d3b5308361f1
          path: web
          fetch-depth: 0
          persist-credentials: false
      - name: Export committed Git objects only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consolidation"
          for repo in server web; do
            git -C "$repo" bundle create "$RUNNER_TEMP/consolidation/$repo.bundle" --all
            git -C "$repo" for-each-ref --format='%(objectname) %(refname)' > "$RUNNER_TEMP/consolidation/$repo-refs.txt"
            git -C "$repo" rev-parse HEAD > "$RUNNER_TEMP/consolidation/$repo-head.txt"
          done
          cd "$RUNNER_TEMP/consolidation"
          sha256sum ./* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: native-consolidation-${{ github.sha }}
          path: ${{ runner.temp }}/consolidation
          retention-days: 3
          if-no-files-found: error
