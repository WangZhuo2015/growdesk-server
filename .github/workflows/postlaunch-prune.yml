name: Prune verified merged Go candidate
on:
  push:
    branches: [codex/postlaunch-auth-review-20260924]
    paths: [.github/workflows/postlaunch-prune.yml]
permissions:
  contents: read
jobs:
  prune-reviewed-candidate:
    if: github.repository == 'WangZhuo2015/growdesk-server'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify ancestry, open PR dependencies and exact remote ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/web-parity-20260919'
          expected='62e03ee6516791402994d25ca4bb63aeb65515f4'
          git fetch origin main "refs/heads/$branch"
          actual=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$expected" origin/main
          for relation in base head; do
            value="$branch"
            if test "$relation" = head; then value="WangZhuo2015:$branch"; fi
            open=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "$relation=$value" -f per_page=1 --jq length)
            test "$open" = 0
          done
          git push --force-with-lease="refs/heads/$branch:$expected" origin ":refs/heads/$branch"
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          printf 'Deleted only %s at %s; ancestor of %s\n' "$branch" "$expected" "$(git rev-parse origin/main)"
