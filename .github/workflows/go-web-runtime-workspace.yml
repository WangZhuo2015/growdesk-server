name: Go Web runtime review workspace
on:
  push:
    branches: [codex/go-web-runtime-20260923]
    paths: [.github/workflows/go-web-runtime-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export committed source only
        run: |
          set -eu
          mkdir -p review-export
          git rev-parse HEAD > review-export/source-sha.txt
          git archive HEAD > review-export/source.tar
          git bundle create review-export/source.bundle HEAD
          (cd review-export && sha256sum source.tar source.bundle source-sha.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: go-web-runtime-review-${{ github.sha }}
          path: review-export/*
          retention-days: 3
          if-no-files-found: error
