name: Verify legacy upload authorization
on:
  push:
    branches: [codex/migration-readiness-20260922]
    paths: [.github/workflows/wire-legacy-upload-20260922.yml]
permissions:
  contents: write
concurrency:
  group: wire-legacy-upload-20260922
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'WangZhuo2015/growdesk-server' && github.ref == 'refs/heads/codex/migration-readiness-20260922'
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/migration-readiness-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Wire only exact source files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','branch','--show-current'],text=True).strip() == 'codex/migration-readiness-20260922'
          def edit(path, blob, old, new):
              p=Path(path)
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == blob, path
              text=p.read_text()
              assert text.count(old)==1, path
              p.write_text(text.replace(old,new))
          edit('apps/api/src/services/attachment-service.ts','f50f80059d1ad700c6293df38fd377b72a1c0d3e',
            'export class AttachmentService {',
            'import { resolveLegacyUpload } from "./legacy-attachment-resolver.js";\n\nexport class AttachmentService {\n  async resolveLegacyUpload(principal: UserPrincipal, pathname: string) {\n    return resolveLegacyUpload(this.prisma, principal.userId, pathname);\n  }\n')
          edit('apps/api/src/routes/attachment-routes.ts','7d86ac8626f20bdeffea70b610398f21038900b7',
            '  const { attachmentService } = opts;',
            '''  const { attachmentService } = opts;
            const { LegacyAttachmentQuerySchema, LegacyAttachmentResponseSchema } = await import("@growdesk/contracts");
            const legacySchema = { operationId: "resolveLegacyWebAttachment", querystring: LegacyAttachmentQuerySchema,
              response: { 200: LegacyAttachmentResponseSchema, 400: ApiErrorEnvelopeSchema,
                401: ApiErrorEnvelopeSchema, 403: ApiErrorEnvelopeSchema, 404: ApiErrorEnvelopeSchema, 503: ApiErrorEnvelopeSchema } };
            fastify.get<{ Querystring: { path: string } }>("/api/v1/web/attachments/resolve-legacy", {
              preHandler: [fastify.authenticate], schema: legacySchema,
            }, async (request, reply) => {
              const data = await attachmentService.resolveLegacyUpload(request.principal!, request.query.path);
              return reply.header("cache-control", "private, no-store").send({ data });
            });''')
          old="command(['node', '--import', 'tsx', '--test', 'tests/integration/web-ai-session-regression.test.ts'], env=env)"
          edit('scripts/test-integration.py','6c4415108fd6ed5939c6058052d043c7daf8b750',old,
            old+"\n            command(['node', '--import', 'tsx', '--test', 'tests/integration/legacy-upload-access.test.ts'], env=env)")
          PY
      - name: Install owned test infrastructure
        run: |
          brew install postgresql@18 redis
          echo "PG_BIN=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
          echo "REDIS_BIN=$(brew --prefix redis)/bin" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run backend:db:generate
      - run: npm run backend:build
      - run: npm run backend:contracts:generate
      - run: npm run backend:typecheck
      - run: npm run backend:lint
      - run: npm run backend:test:guard
      - run: npm run backend:test:unit
      - name: Verify real database permissions and migration invariants
        run: python3 scripts/test-integration.py --legacy-care
      - name: Publish verified wiring and remove temporary workflow
        run: |
          git rm .github/workflows/wire-legacy-upload-20260922.yml
          git add apps/api/src/services/attachment-service.ts apps/api/src/routes/attachment-routes.ts scripts/test-integration.py contracts/openapi.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): wire authorized legacy upload resolution with PostgreSQL regressions'
          git push origin HEAD:refs/heads/codex/migration-readiness-20260922
          git rev-parse HEAD
