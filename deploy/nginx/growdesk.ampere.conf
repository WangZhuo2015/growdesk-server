# Install as one NEW include in the already-running singbox nginx only after
# resolving all placeholders from live host inspection. Do not replace nginx.conf.
# This template assumes nginx can reach the host loopback namespace.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name ampere.zwang.fun;
    ssl_certificate /etc/letsencrypt/live/ampere.zwang.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ampere.zwang.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Dedicated preview API; legacy foundation remains on loopback 3180.
    client_max_body_size 20m;
    location = /health/live {
        proxy_pass http://127.0.0.1:3181;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }
    location = /health/ready {
        proxy_pass http://127.0.0.1:3181;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }
    # Keep the complete API path, authorization headers and SSE streams.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3181;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }
    location = /mcp {
        proxy_pass http://127.0.0.1:3181;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /.well-known/oauth- {
        proxy_pass http://127.0.0.1:3181;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Private preview bucket only; MinIO verifies each signed object request.
    location ^~ /growdesk-preview/ {
        proxy_pass http://127.0.0.1:59000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location / { return 404; }
}
